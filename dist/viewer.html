<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>招生簡章閱讀器</title><style>*{box-sizing:border-box}body{margin:0;background:#e5e7e1;color:#334538;font:14px -apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.controls{position:sticky;top:0;z-index:2;background:#f6f7f2;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;border-bottom:1px solid #d5dbcd;padding:7px;flex-wrap:wrap}button,input{font:inherit;color:inherit;background:white;border:1px solid #d7ddce;border-radius:4px;min-height:32px}button{padding:4px 10px;cursor:pointer}button:disabled{opacity:.4;cursor:default}input{width:50px;text-align:center}#status{text-align:center;padding:8px;margin:0;font-size:12px}#pages{padding:9px 0 25px;overflow:auto;text-align:center}canvas{background:white;box-shadow:0 2px 8px #0002;vertical-align:top}#text{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}a{color:inherit}button:focus-visible,input:focus-visible{outline:2px solid #526a46;outline-offset:2px}</style></head><body><div class="controls"><button id="prev" aria-label="上一頁" disabled>‹</button><label><input id="page" type="number" min="1" value="1" aria-label="頁碼" disabled> / <span id="total">—</span></label><button id="next" aria-label="下一頁" disabled>›</button><button id="minus" aria-label="縮小" disabled>−</button><span id="zoom">適合寬度</span><button id="plus" aria-label="放大" disabled>＋</button></div><p id="status" role="status">正在載入官方簡章…</p><div id="pages"><canvas id="canvas" role="img" aria-label="簡章頁面"></canvas><div id="text"></div></div><script type="module" src="viewer.js"></script></body></html>
